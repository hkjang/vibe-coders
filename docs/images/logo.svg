<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Cyber Gradients -->
    <linearGradient id="vibePurpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" /> <!-- Neon Magenta/Purple -->
      <stop offset="50%" stop-color="#8B5CF6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyber Cyan -->
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Hexagonal Node Frame (Futuristic Grid Accent) -->
  <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" stroke="url(#vibePurpleCyan)" stroke-width="2" stroke-opacity="0.3" fill="none" />
  
  <!-- Outer glowing nodes -->
  <circle cx="60" cy="10" r="2.5" fill="#D946EF" />
  <circle cx="105" cy="35" r="2.5" fill="#8B5CF6" />
  <circle cx="15" cy="35" r="2.5" fill="#8B5CF6" />
  <circle cx="105" cy="85" r="2.5" fill="#06B6D4" />
  <circle cx="15" cy="85" r="2.5" fill="#06B6D4" />
  <circle cx="60" cy="110" r="2.5" fill="#06B6D4" />

  <!-- Stylized Cyber 'V' representing Gateway/Vibe -->
  <path d="M 40,35 L 60,75 L 80,35" stroke="url(#vibePurpleCyan)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)" />
  <!-- Overlapping inner V line for depth -->
  <path d="M 45,35 L 60,65 L 75,35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Code Brackets integrated into the design -->
  <!-- Left Bracket < -->
  <path d="M 32,45 L 20,55 L 32,65" stroke="#D946EF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Right Bracket > -->
  <path d="M 88,45 L 100,55 L 88,65" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Futuristic Laser Wave (SSE Flow / Vibe Wave) -->
  <path d="M 10,78 C 30,60 50,90 70,68 C 85,50 100,85 110,68" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#neonGlow)" />

  <!-- Data Flow Bits (glowing small squares/circles on the wave) -->
  <circle cx="45" cy="73" r="2" fill="#FFFFFF" />
  <circle cx="75" cy="65" r="2" fill="#FFFFFF" />
</svg>
